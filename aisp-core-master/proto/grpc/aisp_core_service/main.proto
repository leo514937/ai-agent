// const string __VERSION__ = '0.0.130'
syntax = "proto3";

option java_package = "com.zhihu.aisp.core.service";
option java_multiple_files = true;
option java_outer_classname = "AispCoreServiceProto";
option go_package = "./aisp_core_service";

package aisp.core;
import "google/protobuf/wrappers.proto";

enum ChatStyle {
  UNDEFINED_STYLE = 0; // 未知
  THOROUGH = 1; // 深入
  SIMPLE = 2; // 简略
  DEEP_THINKING = 3; // 深度思考
}

enum ClientSource {
  UNDEFINED_SOURCE = 0; // 未知
  PC_WEB = 1; // Web端
  MOBILE_WEB = 2; // 移动Web端
  ZHIHU_APP = 3; // 知乎APP
}

// 为了和前端保持统一 这里为小写的枚举
enum TrafficSource {
  undefined_traffic = 0;                         // 未知
  zhida = 1;                                     // 直答主站调用
  ai_search_card = 2;                            // 从综搜首卡跳到直答 tab
  entity = 3;                                    // 实体词接入直答
  comment_entity = 4;                            // 实体词接入直答(comment)
  underlined_word = 5;                           // 划词跳直答
  noanswer_search = 6;                           // 某些问题下无回答出直答 bar
  ai_search_query = 7;                           // 在 PC 上点击搜索框出 AI 搜索词，点击某个词跳到直答
  suggestion = 8;                                // 在 PC 上搜索的 sug 词中的某一个点击后也会跳到直答
  below_banner_question = 9;                     // 回答详情页出相关追问，点击跳转直答
  right_banner_question = 10;                    // PC 上回答详情页右边栏出直答广告位，点击跳直答
  ai_summary_under_answer = 11;                  // 在 mobile_web 上，回答底部出 ai 总结跳直答
  unsatisfied_search = 12;                       // 搜索结果页无搜索结果时出直答 bar
  search_tab = 13;                               // 知乎搜索结果页独立 tab
  follow_query = 14;                             // 搜索结果页出追问，点击跳直答
  viewpoint_page = 15;                           // 有观点搜索卡底部出跳直答
  question_edit_page = 16;                       // 创作端问题编辑页出相似问题时跳直答一键总结
  ai_search_card_preview = 17;                   // 综搜首卡（半弹层）
  entity_preview = 18;                           // 实体词实体（半弹层）
  search_tab_preview = 19;                       // 知乎搜索结果页独立 tab（半弹层）
  zhida_pro = 20;                                // 专业版直答
  zhida_gr_demo = 21;                            // 直答GR demo
  ai_search_card_full_search_preview = 22;       // 综搜首卡-全网搜索（半弹层）
  ai_search_card_full_search = 23;               // 综搜首卡-全网搜索
  internal_qa = 24;                              // 内部问答
  zhida_word_interpretation = 25;                // 直答-划词解释
  zhida_translation = 26;                        // 直答-翻译
  commercial_data_insight = 27;                  // 商业数据洞察（有数）接入
  zhida_summary = 28;                            // 直答-私有召回内容摘要总结（无版权文档等等）
  zhida_knowledge_ground = 29;                   // 直答-知识广场
  search_entity_preview = 30;                    // 实体词 - 跳综搜
  ai_search_general = 31;                        // AI 搜索-通用
  ai_search_hotspot = 32;                        // AI 搜索-热点
  ai_search_koc = 33;                            // AI 搜索-koc
}

enum ChatFocusDomain {
  UNDEFINED_DOMAIN = 0; // 未知
  ALL = 1; // 全网
  SPECIALTY = 2; // 专业
}

// 内容类型
enum DocType {
