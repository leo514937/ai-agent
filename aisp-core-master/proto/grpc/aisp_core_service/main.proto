  COMMENT = 6;            // 评论
  PAPER = 7;              // 内容平台论文
  ZHI_DA_USER_UPLOAD = 8; // 直答用户上传
  MEMBER = 9;             // 用户
  EXTERNAL_WEBPAGE = 10;  // 外部网页
  INTERNAL_DOC = 11;      // 公司内部文档
