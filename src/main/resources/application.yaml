server:
  port: 8081
spring:
  application:
    name: hmdp
  mvc:
    async:
      request-timeout: 15m
  datasource:
    driver-class-name: com.mysql.jdbc.Driver
    url: jdbc:mysql://localhost:3306/hmdp?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC&characterEncoding=utf8
    username: root
    password: 123456
  redis:
    host: localhost
    port: 6379
    password: 
    lettuce:
      pool:
        max-active: 10
        max-idle: 10
        min-idle: 1
        time-between-eviction-runs: 10s
  jackson:
    default-property-inclusion: non_null # JSON处理时忽略非空字段
mybatis-plus:
  type-aliases-package: com.hmdp.entity # 别名扫描包
logging:
  level:
    com.hmdp: debug
ai:
  remote:
    # 显式开启远程 AI 服务
    enabled: true
    base-url: http://127.0.0.1:8000
    internal-token: "local-learning-agent-token"
