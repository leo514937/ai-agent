cases:
  - id: D1-1
    description: "显式单店评价"
    query: "海底捞水晶城店怎么样？"
    expected:
      contains:
        - "海底捞"
        - "水晶城"
      not_contains:
        - "巴奴"
      metrics:
        "target_shop.source": "current_query"
        "single_shop_mode": true

  - id: D1-2-1
    description: "多轮新店覆盖旧店 - 第一轮"
    query: "海底捞水晶城店怎么样？"
    expected:
      contains:
        - "海底捞"
        - "水晶城"

  - id: D1-2-2
    description: "多轮新店覆盖旧店 - 第二轮"
    query: "巴奴毛肚火锅怎么样？"
    expected:
      contains:
        - "巴奴"
      not_contains:
        - "海底捞"
      metrics:
        "target_shop.source": "current_query"

  - id: D1-3-1
    description: "指代词继承旧商铺 - 第一轮"
    query: "海底捞水晶城店怎么样？"
    expected:
      contains:
        - "海底捞"
        - "水晶城"

  - id: D1-3-2
    description: "指代词继承旧商铺 - 第二轮"
    query: "它有券吗？"
    expected:
      contains:
        - "券"
      not_contains:
        - "环境"
        - "口味"
        - "服务"
      metrics:
        "target_shop.source": "pronoun_session"

  - id: D1-4-1
    description: "附近有没有推荐的餐厅？"
    query: "附近有没有推荐的餐厅？"
    expected:
      contains:
        - "推荐"

  - id: D1-4-2
    description: "有券吗？无上下文"
    query: "有券吗？"
    expected:
      contains:
        - "券"
