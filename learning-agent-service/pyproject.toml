[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "learning-agent-service"
version = "0.1.0"
description = "Standalone Python service scaffold for the Java/Agent learning support system."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [
  { name = "Codex Workstream F" },
]
dependencies = [
  "alembic>=1.14.0",
  "fastapi>=0.115.0",
  "httpx>=0.28.0",
  "langgraph>=0.3.0",
  "openai>=1.68.0",
  "orjson>=3.10.0",
  "psycopg[binary]>=3.2.0",
  "pydantic>=2.10.0",
  "pydantic-settings>=2.6.0",
  "qdrant-client>=1.13.0",
  "redis>=5.2.0",
  "sqlalchemy>=2.0.37",
  "structlog>=25.1.0",
  "tenacity>=9.0.0",
  "uvicorn[standard]>=0.34.0",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.14.0",
  "pytest>=8.3.0",
  "pytest-asyncio>=0.25.0",
  "pytest-mock>=3.14.0",
  "ruff>=0.8.0",
]

[project.scripts]
seed-local-life-knowledge = "learning_agent_service.rag.local_life_seed:main"

[tool.hatch.build.targets.wheel]
packages = ["src/learning_agent_service"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
mypy_path = ["src"]
strict = false
warn_unused_configs = true
