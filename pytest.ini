[pytest]
markers =
    no_spy_llm_backend: disable the default spy LLM injection for a test or module
    real_llm_backend: use a real LLM backend instead of the default spy injection
    integration: real DB / Java / service integration test, skipped unless RUN_INTEGRATION_TESTS=1
    e2e: real LLM / full stack end-to-end test, skipped unless RUN_E2E_TESTS=1
